<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Tracker architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399; --accent: #eb6c36; --link: #2e5aa8; }
    body { min-height: 100vh; padding: 48px 32px; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, sans-serif; }
    .frame { width: min(1280px, 100%); margin: 0 auto; }
    .eyebrow { color: var(--muted); font: 500 8px 'Geist Mono', monospace; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font: 400 clamp(28px, 3vw, 40px) 'Instrument Serif', serif; letter-spacing: -.02em; margin-bottom: 24px; }
    svg { display: block; width: 100%; min-width: 960px; height: auto; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture · Asset Tracker</p>
    <h1>Operational map</h1>
    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="asset-tracker-architecture-title asset-tracker-architecture-desc">
      <title id="asset-tracker-architecture-title">Asset Tracker operational architecture</title>
      <desc id="asset-tracker-architecture-desc">React search and admin interfaces call a FastAPI backend, which searches Qdrant and coordinates storage provider synchronization, embedding, and streamed admin status.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>

      <!-- zones -->
      <rect x="40" y="56" width="240" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
      <rect x="56" y="60" width="80" height="16" rx="2" fill="#f5f5f5"/>
      <text x="64" y="72" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing=".14em">FRONTEND</text>
      <rect x="320" y="56" width="520" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>

      <text x="344" y="72" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing=".14em">BACKEND</text>
      <rect x="880" y="56" width="360" height="480" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.12)" stroke-width=".8"/>
      <rect x="896" y="60" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="904" y="72" fill="#7a8399" font-family="'Geist Mono', monospace" font-size="8" letter-spacing=".14em">INTEGRATIONS</text>

      <!-- arrows -->
      <path d="M 240 184 H 360" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <path d="M 520 232 V 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 520 416 V 472" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="532" y="432" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="560" y="441" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">TRIGGER</text>
      <path d="M 680 352 H 960" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="796" y="180" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="840" y="189" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">EMBED TEXT</text>
      <path d="M 1040 240 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 1040 392 V 456" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1052" y="412" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="1092" y="421" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">UPSERT / QUERY</text>
      <path d="M 680 336 H 760 Q 768 336 768 344 V 568 Q 768 576 776 576 H 960" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="804" y="584" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="836" y="593" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle" letter-spacing=".06em">RESULTS</text>

      <!-- frontend nodes -->
      <g><rect x="80" y="136" width="160" height="96" rx="6" fill="#f5f5f5"/><rect x="80" y="136" width="160" height="96" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/><rect x="92" y="148" width="48" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,.5)"/><text x="116" y="160" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">UI</text><text x="160" y="184" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Search UI</text><text x="160" y="208" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">React</text></g>
      <g><rect x="80" y="344" width="160" height="96" rx="6" fill="#f5f5f5"/><rect x="80" y="344" width="160" height="96" rx="6" fill="rgba(79,93,117,.10)" stroke="#7a8399"/><rect x="92" y="356" width="48" height="16" rx="2" fill="transparent" stroke="rgba(122,131,153,.5)"/><text x="116" y="368" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">UI</text><text x="160" y="392" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Admin UI</text><text x="160" y="416" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">React</text></g>

      <g><rect x="360" y="136" width="320" height="96" rx="6" fill="#f5f5f5"/><rect x="360" y="136" width="320" height="96" rx="6" fill="#fff" stroke="#2d3142"/><rect x="372" y="148" width="56" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)"/><text x="400" y="160" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">API</text><text x="520" y="184" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">FastAPI routes</text><text x="520" y="208" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">search · health · thumbnails</text></g>
      <g><rect x="360" y="288" width="320" height="128" rx="6" fill="#f5f5f5"/><rect x="360" y="288" width="320" height="128" rx="6" fill="#fff" stroke="#2d3142"/><rect x="372" y="300" width="88" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.4)"/><text x="416" y="312" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">ADMIN API</text><text x="520" y="352" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Sync &amp; status</text><text x="520" y="376" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">start · stop · stream</text></g>
      <g><rect x="360" y="472" width="320" height="96" rx="6" fill="#f5f5f5"/><rect x="360" y="472" width="320" height="96" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="372" y="484" width="80" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,.5)"/><text x="412" y="496" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">SERVICE</text><text x="520" y="528" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Provider registry</text><text x="520" y="552" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">sync orchestration</text></g>

      <!-- integration nodes -->
      <g><rect x="960" y="136" width="160" height="104" rx="6" fill="#f5f5f5"/><rect x="960" y="136" width="160" height="104" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="972" y="148" width="88" height="16" rx="2" fill="transparent" stroke="rgba(235,108,54,.5)"/><text x="1016" y="160" fill="#eb6c36" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">MODEL</text><text x="1040" y="192" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Embeddings</text><text x="1040" y="216" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">model hosting</text></g>
      <g><rect x="960" y="280" width="160" height="112" rx="6" fill="#f5f5f5"/><rect x="960" y="280" width="160" height="112" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><rect x="972" y="292" width="72" height="16" rx="2" fill="transparent" stroke="rgba(79,93,117,.5)"/><text x="1008" y="304" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">VECTOR DB</text><text x="1040" y="344" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Qdrant</text><text x="1040" y="368" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">vectors + metadata</text></g>
      <g><rect x="960" y="456" width="240" height="120" rx="6" fill="#f5f5f5"/><rect x="960" y="456" width="240" height="120" rx="6" fill="rgba(45,49,66,.03)" stroke="rgba(45,49,66,.4)"/><rect x="972" y="468" width="88" height="16" rx="2" fill="transparent" stroke="rgba(45,49,66,.3)"/><text x="1016" y="480" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">STORAGE</text><text x="1080" y="520" fill="#2d3142" font-family="'Geist', sans-serif" font-size="16" font-weight="600" text-anchor="middle">Cloud providers</text><text x="1080" y="544" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" text-anchor="middle">Google Drive · Dropbox</text></g>

      <!-- legend -->
      <line x1="40" y1="640" x2="1240" y2="640" stroke="rgba(45,49,66,.12)" stroke-width=".8"/>
      <text x="40" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8" letter-spacing=".14em">LEGEND</text>
      <line x1="144" y1="668" x2="184" y2="668" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/><text x="200" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">HTTP</text>
      <line x1="280" y1="668" x2="320" y2="668" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/><text x="336" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">PRIMARY FLOW</text>
      <line x1="488" y1="668" x2="528" y2="668" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/><text x="544" y="672" fill="#4f5d75" font-family="'Geist Mono', monospace" font-size="8">RETURN / ASYNC</text>
    </svg>
  </main>
</body>
</html>
